<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カスタムチェックボックスサンプル</title>
<style>
body {
  font-family: sans-serif;
  background: #1a1a1a;
  color: white;
  padding: 40px;
}

/* ラベルを囲む */
.checkbox {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  font-size: 18px;
  user-select: none;
}

/* ネイティブチェックボックスを消す */
.checkbox input[type="checkbox"] {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  /* border: 2px solid #ccc; */
  border-radius: 2px;
  background: #2a2a2a; /* 未チェック時の色 */
  margin-right: 10px;
  position: relative;
  transition: background 0.2s, border-color 0.2s;
}

/* チェック時の背景色 */
.checkbox input[type="checkbox"]:checked {
  background: #fffb0a; /* チェック時の色 */
  /* border-color: #f5e400; */
}

/* チェックマーク */
.checkbox input[type="checkbox"]:checked::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 0px;
  width: 5px;
  height: 10px;
  border: solid cyan; /* チェックマークの色 */
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* ホバー時の演出 */
.checkbox input[type="checkbox"]:hover {
  border-color: #fffb0a;
}
</style>
</head>
<body>

<h1>カスタムチェックボックス サンプル</h1>

<label class="checkbox">
  <input type="checkbox">
  チェックボックス1
</label>
<br><br>
<label class="checkbox">
  <input type="checkbox">
  チェックボックス2
</label>
<br><br>
<label class="checkbox">
  <input type="checkbox">
  チェックボックス3
</label>

</body>
</html>
