<div id="parent-div"></div>

<div style="display: flex;">
<iframe id="child-01" src="test_iframe_child.html" style="width: 1000px; height: 1000px; transform: scale(0.4); transform-origin: 0 0;"></iframe>
<iframe id="child-02" src="test_iframe_child.html" style="width: 1000px; height: 1000px; transform: scale(0.4); transform-origin: 0 0;"></iframe>
<iframe id="child-03" src="test_iframe_child.html" style="width: 1000px; height: 1000px; transform: scale(0.4); transform-origin: 0 0;"></iframe>
</div>
<style>
#parent-div {
  height: 200px;
  width: 200px;
  background-color: red;
}
</style>

<script>
const parent = document.getElementById("parent-div");
const childView01 = document.getElementById("child-01");
const childView02 = document.getElementById("child-02");
const childView03 = document.getElementById("child-03");

window.addEventListener("load", () => {
  console.log(window.top);
  console.log(window.self);
  console.log(window.top === window.self);
  if(window.top !== window.self){
    parent.style.backgroundColor = "green";
  }

  childView01.contentWindow.postMessage(
    { message: "foo" },
    "*"
  );

  childView02.contentWindow.postMessage(
    { message: "haa" },
    "*"
  );

  childView03.contentWindow.postMessage(
    { message: "yuu" },
    "*"
  );
});

window.addEventListener("message", e => {
  console.log("受信:", e.data);
});
</script>
