<div class="sidebar">
  <div class="tabs">
    <button class="tab-btn active" data-tab="tab1">タブ1</button>
    <button class="tab-btn" data-tab="tab2">タブ2</button>
    <button class="tab-btn" data-tab="tab3">タブ3</button>
  </div>

  <div class="tab-contents">
    <div class="tab-content active" id="tab1">内容1</div>
    <div class="tab-content" id="tab2">内容2</div>
    <div class="tab-content" id="tab3">内容3</div>
  </div>

  <style>
    .sidebar {
  width: 250px;
  background-color: #1e1e1e;
  color: #fff;
  padding: 10px;
  font-family: sans-serif;
}

.tabs {
  display: flex;
  gap: 5px;
  margin-bottom: 10px;
}

.tab-btn {
  flex: 1;
  background-color: #2e2e2e;
  border: none;
  padding: 8px;
  color: #aaa;
  cursor: pointer;
  border-radius: 4px 4px 0 0;
}

.tab-btn.active {
  background-color: #3e3e3e;
  color: #fff;
}

.tab-content {
  display: none;
  background-color: #2a2a2a;
  padding: 10px;
  border-radius: 0 4px 4px 4px;
}

.tab-content.active {
  display: block;
}

  </style>
  <script>
    const tabButtons = document.querySelectorAll(".tab-btn");
const tabContents = document.querySelectorAll(".tab-content");

tabButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    // すべてのタブを非アクティブ
    tabButtons.forEach(b => b.classList.remove("active"));
    tabContents.forEach(c => c.classList.remove("active"));

    // 選択したタブをアクティブ
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("active");
  });
});

  </script>
</div>
