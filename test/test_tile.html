<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Tile Layout</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --tile: #2a2a2a;
      --tile-hover: #333;
      --text: #e0e0e0;
      --muted: #9aa0a6;
      --accent: #4f9cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel);
      border-bottom: 1px solid #2c2c2c;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .header-actions {
      font-size: 0.9rem;
      color: var(--muted);
    }

    main {
      padding: 16px;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .tile {
      position: relative;
      background: var(--tile);
      border-radius: 10px;
      padding: 12px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
    }

    .tile input[type="checkbox"] {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .tile:has(input[type="checkbox"]:checked) {
      box-shadow: 0 0 0 2px var(--accent) inset;
    }

    .tile:hover {
      background: var(--tile-hover);
      transform: translateY(-2px);
    }

    .tile-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .tile-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .badge {
      align-self: flex-start;
      padding: 2px 8px;
      font-size: 0.7rem;
      border-radius: 999px;
      background: rgba(79, 156, 255, 0.15);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="title">Dark Tile Dashboard</div>
      <div class="header-actions">status: online</div>
    </div>
  </header>

  <main>
    <div class="tiles">
      <div class="tile">
        <input type="checkbox" />
        <span class="badge">ACTIVE</span>
        <div>
          <div class="tile-title">Tile 01</div>
          <div class="tile-meta">updated 1m ago</div>
        </div>
      </div>
      <div class="tile">
        <input type="checkbox" />
        <span class="badge">IDLE</span>
        <div>
          <div class="tile-title">Tile 02</div>
          <div class="tile-meta">updated 5m ago</div>
        </div>
      </div>
      <div class="tile">
        <input type="checkbox" />
        <span class="badge">ACTIVE</span>
        <div>
          <div class="tile-title">Tile 03</div>
          <div class="tile-meta">updated 10m ago</div>
        </div>
      </div>
      <div class="tile">
        <input type="checkbox" />
        <span class="badge">ERROR</span>
        <div>
          <div class="tile-title">Tile 04</div>
          <div class="tile-meta">updated 1h ago</div>
        </div>
      </div>
      <div class="tile">
        <input type="checkbox" />
        <span class="badge">ACTIVE</span>
        <div>
          <div class="tile-title">Tile 05</div>
          <div class="tile-meta">updated yesterday</div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
