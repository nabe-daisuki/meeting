<div id="pdf-controls">
  <button id="zoom-in">＋</button>
  <button id="zoom-out">−</button>
  <span id="page-indicator">Page 0 / 0</span>
</div>

<div id="page-nav">
  <button id="prev-page">◀ 前</button>
  <button id="next-page">次 ▶</button>
</div>

<div id="pdf-wrapper">
  <div id="pdf-container"></div>
  <div id="text-panel">
    <ul id="text-items"></ul>
  </div>
</div>

<style>
/* --------- コントロール --------- */
#pdf-controls {
  margin-bottom: 10px;
  color: #fff;
}

#pdf-controls button {
  background: #333;
  color: #fff;
  border: 1px solid #555;
  padding: 6px 12px;
  cursor: pointer;
}

#pdf-controls button:hover {
  background: #555;
}

#page-indicator {
  margin-left: 20px;
}

/* --------- ページナビ --------- */
#page-nav {
  margin-bottom: 10px;
}

#page-nav button {
  background: #333;
  color: #fff;
  border: 1px solid #555;
  padding: 5px 12px;
  cursor: pointer;
}

#page-nav button:hover {
  background: #555;
}

/* --------- PDF とテキスト横並び --------- */
#pdf-wrapper {
  display: flex;
  gap: 10px;
}

/* PDF 表示エリア */
#pdf-container {
  flex: 1;
  height: 600px;
  overflow-y: auto;
  border: 1px solid #444;
  background: #181818;
}

/* ページ間隙間 */
.page-wrapper {
  margin-bottom: 20px;
}

/* テキストパネル */
#text-panel {
  width: 300px;
  height: 600px;
  overflow-y: auto;
  border: 1px solid #444;
  background: #222;
  color: #ccc;
  padding: 5px;
}

#text-items {
  margin: 0;
  padding-left: 20px;
  list-style: disc;
}
</style>

<script src="pdfjs/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "pdfjs/pdf.worker.min.js";

const container = document.getElementById("pdf-container");
const textItems = document.getElementById("text-items");
const pageIndicator = document.getElementById("page-indicator");

let pdf = null;
let scale = 1;
let pageCanvases = [];
let pageTexts = {};

//-------------------------------------------
// 全ページ描画 + テキスト抽出
//-------------------------------------------
async function renderAllPages(pdfDoc, preservePage=true) {
  let currentPageBefore = 1;
  if (preservePage) currentPageBefore = getCurrentPage();

  container.innerHTML = "";
  textItems.innerHTML = "";
  pageCanvases = [];
  pageTexts = {};

  for (let pageNum=1; pageNum<=pdfDoc.numPages; pageNum++) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale });

    // PDF描画
    const wrapper = document.createElement("div");
    wrapper.className = "page-wrapper";

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    wrapper.appendChild(canvas);
    container.appendChild(wrapper);

    pageCanvases.push({ canvas, wrapper, pageNum });

    await page.render({ canvasContext: ctx, viewport }).promise;

    // テキスト抽出（空欄除去）
    const textContent = await page.getTextContent();
    pageTexts[pageNum] = textContent.items
      .map(i => i.str.trim())
      .filter(str => str.length>0);
  }

  updateCurrentPage();

  // 元ページにスクロール
  if (preservePage) {
    const targetWrapper = pageCanvases.find(p=>p.pageNum===currentPageBefore);
    if(targetWrapper) targetWrapper.wrapper.scrollIntoView({block:'start'});
  }
}

//-------------------------------------------
// 現在ページ番号取得
//-------------------------------------------
function getCurrentPage() {
  const containerRect = container.getBoundingClientRect();
  const containerTop = containerRect.top;
  let current = 1;

  for (const { wrapper, pageNum } of pageCanvases) {
    const rect = wrapper.getBoundingClientRect();
    const wrapperTop = rect.top - containerTop;
    if (wrapperTop <= 20) current = pageNum;
    else break;
  }
  return current;
}

//-------------------------------------------
// ページテキスト表示
//-------------------------------------------
function showPageText(pageNum) {
  textItems.innerHTML = "";
  const lines = (pageTexts[pageNum] || []).filter(t=>t.trim().length>0);
  for (const line of lines) {
    const li = document.createElement("li");
    li.textContent = line;
    textItems.appendChild(li);
  }
}

//-------------------------------------------
// ページ更新
//-------------------------------------------
function updateCurrentPage() {
  const current = getCurrentPage();
  pageIndicator.textContent = `Page ${current} / ${pdf.numPages}`;
  showPageText(current);
}

//-------------------------------------------
// 拡大縮小
//-------------------------------------------
document.getElementById("zoom-in").addEventListener("click", ()=>{
  if(!pdf) return;
  scale += 0.2;
  renderAllPages(pdf, true);
});

document.getElementById("zoom-out").addEventListener("click", ()=>{
  if(!pdf) return;
  scale = Math.max(0.2, scale-0.2);
  renderAllPages(pdf, true);
});

//-------------------------------------------
// 前後ページボタン
//-------------------------------------------
document.getElementById("prev-page").addEventListener("click", ()=>{
  const current = getCurrentPage();
  if(current>1){
    const target = pageCanvases.find(p=>p.pageNum===current-1);
    if(target) target.wrapper.scrollIntoView({block:'start'});
  }
});

document.getElementById("next-page").addEventListener("click", ()=>{
  const current = getCurrentPage();
  if(current < pdf.numPages){
    const target = pageCanvases.find(p=>p.pageNum===current+1);
    if(target) target.wrapper.scrollIntoView({block:'start'});
  }
});

//-------------------------------------------
// Drag & Drop
//-------------------------------------------
document.addEventListener("dragover", e=>e.preventDefault());
document.addEventListener("drop", e=>{
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(!file || file.type!=="application/pdf") return;

  const reader = new FileReader();
  reader.onload = ev=>loadPDF(ev.target.result);
  reader.readAsArrayBuffer(file);
});

//-------------------------------------------
// PDFロード
//-------------------------------------------
function loadPDF(pdfData){
  pdfjsLib.getDocument({data:pdfData}).promise.then(pdfDoc=>{
    pdf = pdfDoc;
    renderAllPages(pdf);
  });
}

//-------------------------------------------
// スクロール監視
//-------------------------------------------
container.addEventListener("scroll", ()=>{
  if(!pdf) return;
  updateCurrentPage();
});

let isPanning = false;
let startX = 0;
let startY = 0;
let scrollLeft = 0;
let scrollTop = 0;

container.addEventListener("mousedown", e => {
  isPanning = true;
  container.classList.add("grabbing");

  startX = e.pageX - container.offsetLeft;
  startY = e.pageY - container.offsetTop;
  scrollLeft = container.scrollLeft;
  scrollTop = container.scrollTop;
});

document.addEventListener("mouseup", () => {
  isPanning = false;
  container.classList.remove("grabbing");
});

container.addEventListener("mousemove", e => {
  if (!isPanning) return;

  const x = e.pageX - container.offsetLeft;
  const y = e.pageY - container.offsetTop;

  const walkX = (x - startX) * -1; // 逆方向に動くように
  const walkY = (y - startY) * -1;

  container.scrollLeft = scrollLeft + walkX;
  container.scrollTop = scrollTop + walkY;
});
</script>
