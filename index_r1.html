<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>議事録作成支援ページ</title>
<style>
  body { margin:0; font-family: sans-serif; }

  
  /*@@@@@@@@*/
  /* header */
  /*@@@@@@@@*/
  #header {
    position: sticky;
    top:0;
    background:#e7e7e7;
    padding:10px;
    z-index:100;
    display: flex;
    flex-direction: column;
  }

  #audio-controller {
    display: flex;
    gap: 10px;
  }

  #user-tool {
    display: flex;
    flex-direction: column;
  }
  #config {
    margin: 10px 10px 10px 30px;
    width: 30px;
    cursor: pointer;
  }
  #help {
    margin: 10px 10px 10px 30px;
    width: 30px;
    cursor: pointer;
  }

  /*********/
  /* tools */
  /*********/
  #tools {
    display: flex;
  }

  /***********************/
  /* text-file-input-box */
  /***********************/
  /* #text-file-input-box {
    display: flex;
    flex-direction: column;
    margin-right: 20px;
  }
  #text-file-input-box input[type="file"] {
    display: none;
  }
  #text-file-input-box label {
    background-color: #007bff;
    color: white;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: sans-serif;
  }
  #text-file-input-box .file-name {
    margin-left: 10px;
    font-family: sans-serif;
  } */

  /************************/
  /* audio-file-input-box */
  /************************/
  /* #audio-file-input-box {
    display: flex;
    flex-direction: column;
    margin-right: 20px;
  }
  #audio-file-input-box input[type="file"] {
    display: none;
  }
  #audio-file-input-box label {
    background-color: #007bff;
    color: white;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: sans-serif;
  }
  #audio-file-input-box .file-name {
    margin-left: 10px;
    font-family: sans-serif;
  } */

  /*******************/
  /* auto-scroll-box */
  /*******************/
  #auto-scroll-box {
    margin-right: 20px;
  }

  /************/
  /* hatching */
  /************/
  #inputer, #effect {
    display: flex;
    gap: 10px;
    margin-right: 20px;
  }

  /********/
  /* save */
  /********/
  #save {
    display: flex;
    gap: 10px;
    margin-right: 20px;
  }

  /**********/
  /* export */
  /**********/
  #export {
    display: flex;
    gap: 10px;
    margin-right: 20px;
  }

  /*********/
  /* audio */
  /*********/
  #audio {
    padding-bottom: 10px;
    width: 100%;
  }



  /*@@@@@@@@@@@@@@@@@@@@@@*/
  /* editor-panel */
  /*@@@@@@@@@@@@@@@@@@@@@@*/
  #editor-panel {
    display:flex;
    overflow:hidden;
  }

  /*********/
  /* panel */
  /*********/
  #left-panel {
    flex: 2;
  }
  #right-panel {
    flex: 0.5;
    display: flex;
    flex-direction: column;
    padding: 1rem;
    gap: 1rem;
    background: #f7f7f7;
  }
  .panel {
    overflow-y: auto;
    border:1px solid #ccc;
  }
  #doc-header {
    position: sticky;
    top: 0;
    background: #f0f0f0;
    font-weight: bold;
    padding: 2px 5px;
    z-index: 90;
    border-bottom: 1px solid #ccc;
  }
  .chunk {
    display: flex;
    justify-content: space-between;
    padding: 2px 5px;
    border: 1px solid rgba(255, 255, 255, 1);
  }
  .chunk.selected {
    border: 1px solid red;
  }
  .textmeta {
    display: flex;
    flex-direction: column;
  }
  .timestamp {
    cursor:pointer;
    color:blue;
    text-decoration:underline;
  }
  .badged {
    background-color :white;
    flex: 1;
    margin: 5px;
    border-radius: 10px;
    border: 1px solid gray;
    padding: 5px;
    display: flex;
    gap: 5px;
  }
  .text {
    flex:1;
    margin-left:5px;
    overflow: hidden;
    resize: none;
  }
  textarea {
    appearance: none;
    padding: 0;
    margin: 0;
    box-sizing: border-box;  
  }
  .disabled {
    opacity:0.3;
  }
  .edited {
    color:red;
  }
  .invalid-button {
    cursor:pointer;
    margin-left:5px;
    color:red;
  }
  .invalid-button.disabled {
    cursor: default;
  }

  /* 緑ハッチ */
  .green-hatch {
    background: repeating-linear-gradient(
      45deg,
      rgba(144,238,144,0.3), /* 薄緑＋やや濃い目で黄色より見える */
      rgba(144,238,144,0.3) 5px,
      transparent 5px,
      transparent 10px
    );
    z-index: 1;
  }
  /* 黄色背景は半透明に */
  .yellow-hatch {
    background-color: rgba(255,255,0,0.2);
    position: relative;
    z-index: 2;
  }
  
  #inactive-overlay {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    top: 0;
    left: 0;
    position: fixed;
    z-index: 2000;
    font-size: 80px;
    width: 100%;
    height: 100%;
    background-color: rgba(128,128,128,0.9);
  }
  #sub-comment{
    font-size: 40px;
    color: rgb(70, 70, 70);
  }
</style>
  <link rel="stylesheet" href="css/auto-scroll-switch.css">
  <link rel="stylesheet" href="css/action-button.css">
  <link rel="stylesheet" href="css/flex-textarea.css">
  <link rel="stylesheet" href="css/contextmenu.css">
  <link rel="stylesheet" href="css/slider.css">
  <link rel="stylesheet" href="css/tools.css">
  <link rel="stylesheet" href="css/badge.css">
  <link rel="stylesheet" href="css/file-drop-overlay.css">
  <link rel="stylesheet" href="css/replace.css">
  <link rel="stylesheet" href="css/config.css">
  <link rel="stylesheet" href="css/input-button.css">
</head>
<body>



<div id="header">

  <div style = "display: flex;">

    <div style = "flex: 1;">
      <audio id="audio" loop controls tabindex="-1"></audio>
      <div id="audio-controller">
        <div title="会議音声のボリュームを操作できます。" class="slider">
          <img src="img/volume.png">
          <input type="range" id="volume-slider" min="0" max="100" value="10">
          <span class="slider-label" id="volume-label">10%</span>
        </div>
        <div title="会議音声の速度を操作できます。" class="slider">
          <img src="img/speed.png">
          <input type="range" id="speed-slider" min="0" max="100" value="50">
          <span class="slider-label" id="speed-label">100%</span>
        </div>

        <div id="auto-scroll-box">
          <label title="有効(紫色)にすると、会議音声に合わせてスクロールが自動で動きます。" for="auto-scroll" class="auto-scroll-switch">
            <input type="checkbox" id="auto-scroll">
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
            <span class="t">自動スクロール</span>
          </label>
        </div>
      </div>
    </div>

    <div id="user-tool">
      <img id="config" src="img/config.png">
      <img id="help" src="img/help.png">
    </div>

  </div>

  <hr style="width:100%">

  <div id="tools">
    <div id="inputer">
      <div id="text-file-input-box" class="file-input-box theme-blue">
        <label 
          for="text-file-input" 
          title="テキストファイル(.txt)を読み込みます。"
        >
          <img src="img/input-text.png" alt="テキストの読込" class="tool-icon-btn">
          <span class="tool-caption">テキストの<br>読込</span>
        </label>
        <input type="file" id="text-file-input" accept=".txt" tabindex="-1">
      </div>

      <div id="audio-file-input-box" class="file-input-box theme-blue">
        <label 
          for="audio-file-input" 
          title="会議音声ファイル(.mp3)を読み込みます。"
        >
          <img src="img/input-audio.png" alt="会議音声の読込" class="tool-icon-btn">
          <span class="tool-caption">会議音声の<br>読込</span>
        </label>
        <input type="file" id="audio-file-input" accept=".mp3" tabindex="-1">
      </div>

      <div>
        <div id="reload-file-input-box" class="file-input-box theme-blue">
          <label 
            for="reload-file-input" 
            title="保存データ(.giji)を読み込み、状態を復元します。"
          >
            <img src="img/load.png" alt="保存の読込" class="tool-icon-btn">
            <span class="tool-caption">保存の読込</span>
          </label>
          <input type="file" id="reload-file-input" accept=".txt" tabindex="-1">
        </div>
      </div>
    
    </div>
    
    <!-- <div id="text-file-input-box">
      <label title="テキストファイル(.txt)を自分のパソコンから選択します。テキストファイルは1つ選んでください。" for="text-file-input">テキストファイルを選択する</label>
      <span class="file-name" id="text-file-name">未選択</span>
      <input type="file" id="text-file-input" accept=".giji" tabindex="-1">
    </div> -->

    <!-- <div id="audio-file-input-box">
      <label title="会議音声ファイル(.mp3)を自分のパソコンから選択します。" for="audio-file-input">会議音声を選択する</label>
      <span class="file-name" id="audio-file-name"></span>
      <input type="file" id="audio-file-input" accept="audio/*" tabindex="-1">
    </div> -->

    <div id="effect">
      <div
        id="checked-set-green"
        title="チェックされた行を緑ハッチします。"
        class="tool-button"
        tabindex="-1"
      >
        <img src="img/check-to-hatch.png" alt="チェックを緑ハッチ" class="tool-icon">
        <div class="tool-caption">チェックを<br>緑ハッチ</div>
      </div>

      <div
        id="checked-show"
        title="チェックされた行を表示します。"
        class="tool-button"
        tabindex="-1"
      >
        <img src="img/check-to-show.png" alt="チェックを表示" class="tool-icon">
        <div class="tool-caption">チェックを<br>表示</div>
      </div>

      <div
        id="checked-hide"
        title="チェックされた行を非表示にします。"
        class="tool-button"
        tabindex="-1"
      >
        <img src="img/check-to-hide.png" alt="チェックを隠す" class="tool-icon">
        <div class="tool-caption">チェックを<br>隠す</div>
      </div>

      <div
        id="edited-set-green"
        title="編集された行を緑ハッチします。"
        class="tool-button"
        tabindex="-1"
      >
        <img src="img/edited-to-hatch.png" alt="編集行を緑ハッチ" class="tool-icon">
        <div class="tool-caption">編集行を<br>緑ハッチ</div>
      </div>

    </div>


    <div id="save">
      <div
        id="-save-btn"
        title="状態を保存します。"
        class="tool-button"
        tabindex="-1"
        disabled
      >
        <img src="img/save.png" alt="状態保存" class="tool-icon">
        <div class="tool-caption">状態保存</div>
      </div>

      <div
        id="named-save-btn"
        title="状態を名前を付けて保存します。"
        class="tool-button"
        tabindex="-1"
        disabled
      >
        <img src="img/named-save.png" alt="名前を付けて保存" class="tool-icon">
        <div class="tool-caption">名前を付けて<br>保存</div>
      </div>
      <!-- <button title="現状の編集状態を保存します。ファイルはテキストファイル(.txt)で、自分のパソコンのダウンロードファイルに保存されます。保存されたファイルは「保存データ読込」で利用できます。" id="save-btn" class="btn-neutral btn-disabled" tabindex="-1" disabled>状態保存</button>
      <button title="現状の編集状態を名前を付けて保存します。ファイルはテキストファイル(.txt)で、自分のパソコンのダウンロードファイルに保存されます。保存されたファイルは「保存データ読込」で利用できます。" id="named-save-btn" class="btn-neutral btn-disabled" tabindex="-1" disabled>名前を付けて保存</button> -->
    </div>

    <div id="export">
      <div
        id="export-green"
        title="緑ハッチされた行を出力します。"
        class="tool-button"
        tabindex="-1"
      >
        <img src="img/hatch-to-export.png" alt="チェックを表示" class="tool-icon">
        <div class="tool-caption">緑ハッチを<br>出力</div>
      </div>
      <!-- <button title="緑ハッチされた行をテキストファイル(.txt)で自分のパソコンのダウンロードフォルダに保存します。もし、緑ハッチが同じ行にあった場合出力は停止されます。その際は「注意書き」及び「該当行は赤ハッチ」となります。赤ハッチは右クリックで解除ください。" id="export-green" class="btn-green" tabindex="-1">緑ハッチ出力</button> -->
    </div>

  </div>
</div>


<div id="editor-panel">
  <div class="panel" id="left-panel"></div>
  <div class="panel" id="right-panel">

    <div class="tool-section" id="taraTool" style="display:none;">
      <div class="tool-header">「たら」の言い換え</div>
      <div class="tool-buttons">
        <button data-replace="した際">した際</button>
        <button data-replace="した場合">した場合</button>
        <button data-replace="したが">したが</button>
      </div>
    </div>

    <div class="tool-section">
      <div class="tool-header">発言者</div>
      <div id="speakers" class="tool-buttons">
      </div>
    </div>

    <div class="tool-section">
      <div class="tool-header">バッジ</div>
      <div id = "badges" class="tool-buttons">
        <div class="badge big-badge attachment-badge" id="attachment-badge" draggable="true">
          <img src="img/attachment.png">
        </div>
        <div class="badge big-badge comment-badge" id="comment-badge" draggable="true">
          <img src="img/comment.png">
        </div>
        <div class="badge big-badge start-badge" id="start-badge" draggable="true">
          <img src="img/start.png">
        </div>
        <div class="badge big-badge response-badge" id="response-badge" draggable="true">
          <img src="img/response.png">
        </div>
      </div>
    </div>

    <div class="tool-section tool-bottom">
      <div class="tool-header">置換履歴</div>
      <ul id="repinfos" class="tool-buttons">
      </ul>
    </div>
  </div>

  
</div>

<div id="menu" class="context-menu">
</div>

<div id="file-drop-overlay">
  <div id="file-drop-border">
    <div id="file-drop-area">ここにファイル(.giji)をドロップしてね</div>
  </div>
</div>

<div id="inactive-overlay">
  <div id="main-comment">
    本ページをご利用する場合は、<br>
    画面をクリックしてください。
  </div>
  <div id="sub-comment">（テキストファイルや音声ファイル選択等の場合は除く）</div>
</div>


<div id="config-overlay">
  <div id="config-backdrop" tabindex="-1"></div>

  <div id="config-modal">
    <div id="config-header">
      <div>
        <div id="config-title">設定</div>
        <div id="config-desc">✓チェック、テキスト入力、ドロップダウンなどを含む設定項目。</div>
      </div>
      <button id="config-x" class="config-btn secondary config-focus-ring">✕</button>
    </div>

    <div id="config-body">
      <div id="config-list"></div>
    </div>

    <div id="config-footer">
      <button id="config-cancel" class="config-btn secondary config-focus-ring">キャンセル</button>
      <button id="config-ok" class="config-btn config-focus-ring">OK</button>
    </div>
  </div>
</div>


<script src="js/elem.js"></script>
<script src="js/header.js"></script>
<script src="js/line.js"></script>
<script src="js/doc.js"></script>
<script src="js/textfile.js"></script>
<script src="js/scroll.js"></script>
<script src="js/selection.js"></script>
<script src="js/fileparser.js"></script>
<script src="js/hatching.js"></script>
<script src="js/effector.js"></script>
<script src="js/docheader.js"></script>
<script src="js/convert.js"></script>
<script src="js/selector.js"></script>
<script src="js/selectors.js"></script>
<script src="js/badged.js"></script>
<script src="js/timestamp.js"></script>
<script src="js/textbody.js"></script>
<script src="js/invalidbtn.js"></script>
<script src="js/chunk.js"></script>
<script src="js/render.js"></script>
<script src="js/textinput.js"></script>
<script src="js/gijiinput.js"></script>
<script src="js/audioinput.js"></script>
<script src="js/audiocontroller.js"></script>
<script src="js/menudata.js"></script>
<script src="js/contextmenu.js"></script>
<script src="js/save.js"></script>
<script src="js/export.js"></script>
<script src="js/load.js"></script>
<script src="js/badge.js"></script>
<script src="js/speaker.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/clipboard.js"></script>
<script src="js/replace.js"></script>
<script src="js/config.js"></script>
<script src="js/meta.js"></script>

<script src="js/app.js"></script>

</body>
</html>
