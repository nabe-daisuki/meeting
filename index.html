<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>議事録作成支援ページ</title>
  <script src="js/pdfjs/pdf.min.js"></script>
<style>
  body { margin:0; font-family: sans-serif; }
  body.active {
    cursor: col-resize;
  }

  /************/
  /* hatching */
  /************/
  #inputer, #effect {
    display: flex;
    gap: 10px;
    margin-right: 20px;
  }
  #inputer.hide, #effect.hide {
    display: none;
  }

  /********/
  /* save */
  /********/
  #save {
    display: flex;
    gap: 10px;
    margin-right: 20px;
  }

  /**********/
  /* export */
  /**********/
  #export {
    display: flex;
    gap: 10px;
    margin-right: 20px;
  }
  
  #inactive-overlay {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    top: 0;
    left: 0;
    position: fixed;
    z-index: 2000;
    font-size: 80px;
    width: 100%;
    height: 100%;
    background-color: rgba(128,128,128,0.9);
  }
  #sub-comment{
    font-size: 40px;
    color: rgb(70, 70, 70);
  }
</style>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/sub-theme.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/resize-bar.css">
  <link rel="stylesheet" href="css/left-panel.css">
  <link rel="stylesheet" href="css/right-panel.css">
  <link rel="stylesheet" href="css/auto-scroll-switch.css">
  <link rel="stylesheet" href="css/seek-label.css">
  <link rel="stylesheet" href="css/action-button.css">
  <link rel="stylesheet" href="css/text-box.css">
  <link rel="stylesheet" href="css/contextmenu.css">
  <link rel="stylesheet" href="css/slider.css">
  <link rel="stylesheet" href="css/main-tool.css">
  <link rel="stylesheet" href="css/sub-tool.css">
  <link rel="stylesheet" href="css/badge.css">
  <link rel="stylesheet" href="css/file-drop-overlay.css">
  <link rel="stylesheet" href="css/replace.css">
  <link rel="stylesheet" href="css/case-categorizing.css">
  <link rel="stylesheet" href="css/user-select.css">
  <link rel="stylesheet" href="css/pdf-viewer.css">
  <link rel="stylesheet" href="css/config.css">
  <link rel="stylesheet" href="css/input-button.css">
  <link rel="stylesheet" href="css/shortcut-helper.css">
  <link rel="stylesheet" href="css/search-helper.css">
  <link rel="stylesheet" href="css/replace-helper.css">
</head>
<body>



<div id="header">

  <div style = "display: flex;">

    <div style = "flex: 1;">
      <audio id="audio" loop controls tabindex="-1"></audio>
      <div id="playback-box"  title="音声をシークできます。" class="slider big">
        <div id="playback-time-box">
          <span id="current-time" class="dark_theme_yellow">0:00:00</span>
          <span id="duration-time">/0:00:10</span>
        </div>
        <img title="音声を再生します。" src="img/theme/default/play.png" id="play-btn">
        <img title="音声を一時停止します。" src="img/theme/default/pause.png" id="pause-btn" class="hide">
        <img title="音声を停止します。" src="img/theme/default/stop.png" id="stop-btn">
        <div id="playback-slider-box">
          <input type="range" id="playback-slider" class="dark_theme_yellow" min="0.00" max="100.00" value="0.00" step="0.01">
        </div>
      </div>
      <div id="audio-controller">
        <div id="volume-box" title="音声のボリュームを操作できます。" class="slider">
          <img title="音声をミュートします。" src="img/theme/default/volume.png" id="unmute-btn">
          <img title="音声のミュートを解除します。" src="img/theme/default/mute.png" id="mute-btn" class="hide">
          <input type="range" id="volume-slider" class="dark_theme_yellow" min="0" max="100" value="10">
          <span class="slider-label" id="volume-label">10%</span>
        </div>
        <div id="speed-box" title="音声の速度を操作できます。" class="slider">
          <img title="音声の速度をx1.0にします。" src="img/theme/default/speed.png" id="normal-speed-btn">
          <input type="range" id="speed-slider" class="dark_theme_yellow" min="0" max="2.00" value="1.00" step="0.01">
          <span class="slider-label" id="speed-label">100%</span>
        </div>

        <div id="auto-scroll-box">
          <label title="有効にすると、音声に合わせてスクロールが自動で動きます。" for="auto-scroll" class="auto-scroll-switch">
            <img src="img/theme/default/auto-scroll.png">
            <input type="checkbox" id="auto-scroll">
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          </label>
        </div>
      </div>
    </div>

    <div id="user-tool">
      <img id="config" src="img/theme/default/config.png">
      <img id="help" src="img/theme/default/help.png">
    </div>

  </div>

  <hr style="width:100%">

  <div id="main-tools">
    <div id="inputer" class="main-tool">
      <div id="text-file-input-box" class="file-input-box theme-blue">
        <label 
          for="text-file-input" 
          title="テキストファイル(.txt)を読み込みます。"
        >
          <img src="img/theme/default/input-text.png" alt="テキストの読込" class="main-tool-icon">
          <span class="main-tool-caption">テキストの<br>読込</span>
        </label>
        <input type="file" id="text-file-input" accept=".txt" tabindex="-1">
      </div>

      <div id="audio-file-input-box" class="file-input-box theme-blue">
        <label 
          for="audio-file-input" 
          title="音声ファイル(.mp3)を読み込みます。"
        >
          <img src="img/theme/default/input-audio.png" alt="音声の読込" class="main-tool-icon">
          <span class="main-tool-caption">音声の<br>読込</span>
        </label>
        <input type="file" id="audio-file-input" accept=".mp3" tabindex="-1">
      </div>

      <div id="reload-file-input-box" class="file-input-box theme-blue">
        <label 
          for="reload-file-input" 
          title="保存データ(.giji)を読み込み、状態を復元します。"
        >
          <img src="img/theme/default/load.png" alt="保存の読込" class="main-tool-icon">
          <span class="main-tool-caption">保存の読込</span>
        </label>
        <input type="file" id="reload-file-input" accept=".txt" tabindex="-1">
      </div>
    
    </div>

    <div id="effect" class="main-tool">
      <div
        id="checked-set-green"
        title="チェックされた行を緑ハッチします。"
        class="main-tool-button theme-yellow"
        tabindex="-1"
      >
        <img src="img/theme/default/check-to-hatch.png" alt="チェックを緑ハッチ" class="main-tool-icon">
        <div class="main-tool-caption">チェックを<br>緑ハッチ</div>
      </div>

      <div
        id="checked-show"
        title="チェックされた行を表示します。"
        class="main-tool-button theme-yellow"
        tabindex="-1"
      >
        <img src="img/theme/default/check-to-show.png" alt="チェックを表示" class="main-tool-icon">
        <div class="main-tool-caption">チェックを<br>表示</div>
      </div>

      <div
        id="checked-hide"
        title="チェックされた行を非表示にします。"
        class="main-tool-button theme-yellow"
        tabindex="-1"
      >
        <img src="img/theme/default/check-to-hide.png" alt="チェックを隠す" class="main-tool-icon">
        <div class="main-tool-caption">チェックを<br>隠す</div>
      </div>

      <div
        id="edited-set-green"
        title="編集された行を緑ハッチします。"
        class="main-tool-button theme-yellow"
        tabindex="-1"
      >
        <img src="img/theme/default/edited-to-hatch.png" alt="編集行を緑ハッチ" class="main-tool-icon">
        <div class="main-tool-caption">編集行を<br>緑ハッチ</div>
      </div>

    </div>

    <div id="save" class="main-tool">
      <div
        id="save-btn"
        title="状態を保存します。"
        class="main-tool-button theme-yellow"
        tabindex="-1"
        disabled
      >
        <img src="img/theme/default/save.png" alt="状態保存" class="main-tool-icon">
        <div class="main-tool-caption">状態保存</div>
      </div>

      <div
        id="named-save-btn"
        title="状態を名前を付けて保存します。"
        class="main-tool-button theme-yellow"
        tabindex="-1"
        disabled
      >
        <img src="img/theme/default/named-save.png" alt="名前を付けて保存" class="main-tool-icon">
        <div class="main-tool-caption">名前を付けて<br>保存</div>
      </div>
    </div>

    <div id="export" class="main-tool">
      <div
        id="config-to-export"
        title="設定を出力します。"
        class="main-tool-button theme-yellow"
        tabindex="-1"
      >
        <img src="img/theme/default/config-to-export.png" alt="緑ハッチを出力" class="main-tool-icon">
        <div class="main-tool-caption">設定を出力</div>
      </div>

      <div
        id="hatch-to-export"
        title="緑ハッチされた行を出力します。"
        class="main-tool-button theme-yellow"
        tabindex="-1"
      >
        <img src="img/theme/default/hatch-to-export.png" alt="緑ハッチを出力" class="main-tool-icon">
        <div class="main-tool-caption">緑ハッチを<br>出力</div>
      </div>

      <div
        id="edited-to-export"
        title="編集された行を出力します。"
        class="main-tool-button theme-yellow"
        tabindex="-1"
      >
        <img src="img/theme/default/hatch-to-export.png" alt="編集行を出力" class="main-tool-icon">
        <div class="main-tool-caption">編集行を<br>出力</div>
      </div>
    </div>

    <div id="main-tool-open-close"><img src="img/theme/dark/close.png"></div>
  </div>

  <div id="pdf-viewer" class="hide">
    <div id="pdf-controls">
      <div id="zoom-in">
        <img src="img/theme/dark/zoom-in.png">
      </div>
      <div id="zoom-out">
        <img src="img/theme/dark/zoom-out.png">
      </div>
      
      <hr style="border-color: #3f3f3f;width: 100%;">
      
      <div id="prev-page">
        <img id="move-top-page" src="img/theme/dark/top.png">
        <img id="move-prev-page" src="img/theme/dark/up.png">
      </div>
      <div id="page-counter">
        <input id="current-page-num" type="text">
        <div id="total-page-num"></div>
      </div>
      <div id="next-page">
        <img id="move-next-page" src="img/theme/dark/down.png">
        <img id="move-bottom-page" src="img/theme/dark/bottom.png">
      </div>

      <hr style="border-color: #3f3f3f;width: 100%;">

      <div id="page-post">
        <img src="img/theme/dark/post.png">
      </div>
    </div>

    <div id="pdf-container">
      <div id="pdf-view"></div>
      <div id="pdf-texts"></div>
    </div>

    <div id="pdf-close-box">
      <img src="img/theme/dark/cross.png">
    </div>

  </div>
</div>

<div id="editor-panel">
  <div class="panel dark_theme_yellow" id="left-panel"></div>

  <div id="resize-bar"></div>

  <div class="panel" id="right-panel">
    <div id="tabs">
      <button class="tab-btn active" data-tab="edit-tools">編集補助</button>
      <button class="tab-btn" data-tab="reference-tools">CRリスト</button>
      <button class="tab-btn" data-tab="output-tools">出力</button>
      <button class="tab-btn" data-tab="analyze-tools">解析</button>
    </div>

    <div id="sub-tools">
      <div id="edit-tools" class="tab-content active">
        <div class="sub-tool-section dark_theme_yellow">
          <div class="sub-tool-header">発言者</div>
          <div id="speakers" class="sub-tool-buttons">
          </div>
        </div>

        <div class="sub-tool-section dark_theme_yellow">
          <div class="sub-tool-header">バッジ</div>
          <div id="badges" class="sub-tool-buttons">
            <div class="badge big-badge donthear-badge" id="donthear-badge" draggable="true">
              <img src="img/donthear.png">
            </div>
            <div class="badge big-badge comment-badge" id="comment-badge" draggable="true">
              <img src="img/comment.png">
            </div>
            <div class="badge big-badge response-badge" id="response-badge" draggable="true">
              <img src="img/response.png">
            </div>
            <div class="badge big-badge attachment-badge" id="attachment-badge" draggable="true">
              <img src="img/attachment.png">
            </div>
            <div class="badge big-badge start-badge" id="start-badge" draggable="true">
              <img src="img/start.png">
            </div>
          </div>
        </div>
      </div>

      <div id="reference-tools" class="tab-content">
        <div class="sub-tool-section dark_theme_yellow">
          <div id="case-ids-selector">
            <div id="case-ids-wrapper" draggable="true">
              <div id="case-ids-handle"></div>
              <select id="case-ids" class="sub-tool-select"></select>
            </div>
            <div id="case-ids-switcher">
              <img id="prev-case-btn" src="img/theme/dark/left.png">
              <img id="next-case-btn" src="img/theme/dark/right.png">
              <img id="categorize-update-btn" src="img/theme/dark/update.png">
            </div>
          </div>
          <ul id="case-content"></ul>
        </div>
      </div>

      <div id="output-tools" class="tab-content">
        <div class="sub-tool-section dark_theme_yellow">
          <div class="sub-tool-header">出力</div>
          <div id="output"></div>
        </div>
      </div>

      <div id="analyze-tools" class="tab-content">
        <div class="sub-tool-section dark_theme_yellow">
          <div class="sub-tool-header">置換履歴</div>
          <ul id="repinfos" class="sub-tool-buttons">
          </ul>
        </div>
      </div>
    </div>
    
  </div>

  
</div>

<div id="menu" class="context-menu">
</div>

<div id="case-categorizing-overlay" class="hide">
  <div id="categorize-tools">
    <div id="category-color">
      <div class="category-color-btn active" style="background-color:#f44336;"></div>
      <div class="category-color-btn" style="background-color:#2196f3;"></div>
      <div class="category-color-btn" style="background-color:#4caf50;"></div>
      <div class="category-color-btn" style="background-color:#ffeb3b;"></div>
      <div class="category-color-btn" style="background-color:#9c27b0;"></div>
    </div>
    <div id="category-ok-btn-box">
      <button id="category-ok-btn">O　K</button>
    </div>
  </div>
  <div id="categorizing-area">
    <canvas></canvas>
    <div id="be-categorized-items"></div>
    <div id="draw-pointer"></div>
  </div>
  <div id="category-result"></div>
</div>

<div id="user-select-overlay" class="hide">
  <div id="user-select-title">利用者を選択してください</div>

  <div id="user-buttons">
  </div>
</div>

<label for="giji-file-input" id="file-drop-overlay">
  <input type="file" id="giji-file-input" accept=".giji" class="hide" tabindex="-1">
  <div id="file-drop-border">
    <div id="file-drop-area">
      <div>
        <div style="width: 256px; height: 256px;">
          <img id="load-neutral-img" src="img/theme/dark/load.png">
          <img id="load-by-selection-img" src="img/load-by-selection.png">
          <img id="load-by-drop-img" src="img/load-by-drop.png">
        </div>
      </div>
      <span id="load-by-selection">クリックしてファイル(.giji)を選択してね</span>
      <span id="load-or">or</span>
      <span id="load-by-drop">ここにファイル(.giji)をドロップしてね</span>
    </div>
  </div>
</label>

<div id="inactive-overlay">
  <div id="main-comment">
    本ページをご利用する場合は、<br>
    画面をクリックしてください。
  </div>
  <div id="sub-comment">（テキストファイルや音声ファイル選択等の場合は除く）</div>
</div>


<div id="config-overlay">
  <div id="config-backdrop" tabindex="-1"></div>

  <div id="config-modal">
    <div id="config-header">
      <div>
        <div id="config-title">設定</div>
        <div id="config-desc">✓チェック、テキスト入力、ドロップダウンなどを含む設定項目。</div>
      </div>
      <button id="config-x" class="config-btn secondary config-focus-ring">✕</button>
    </div>

    <div id="config-body">
      <div id="config-list"></div>
    </div>

    <div id="config-footer">
      <button id="config-cancel" class="config-btn secondary config-focus-ring">キャンセル</button>
      <button id="config-ok" class="config-btn config-focus-ring">OK</button>
    </div>
  </div>
</div>

<div id="shortcut-helper" class="hide">
  <div id="shortcut-list">
  </div>
</div>

<div id="search-helper">
  <div id="search-container" class="hide">
    <div id="search-box">
      <input type="text" id="search-input" placeholder="検索文字を入力ください🙇">
      <div id="search-result">0/0</div>
      <div id="can-move-audio"></div>
      <div id="search-close">✕</div>
    </div>
  </div>
</div>

<div id="replace-helper">
  <div id="replace-container" class="hide">
    <div id="replace-box">
      <input type="text" id="replace-input" placeholder="置換文字を入力ください🙇">
      <img id="replacing" src="img/theme/dark/replace.png">
      <div id="replace-close">✕</div>
    </div>
  </div>
  <ul id="replace-compare" class="hide"></ul>
</div>


<style>
.hide { display: none; }
</style>
<script src="js/elem.js"></script>
<script src="js/calc.js"></script>

<script src="js/resizebar.js"></script>

<script src="js/selectors.js"></script>

<script src="js/audiocontroller.js"></script>
<script src="js/seeklabel.js"></script>
<script src="js/menudata.js"></script>
<script src="js/contextmenu.js"></script>

<script src="js/replacehelper.js"></script>

<script src="js/replace.js"></script>

<script src="js/app.js"></script>

</body>
</html>
